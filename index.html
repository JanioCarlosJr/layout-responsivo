<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Layout Responsivo</title>
</head>

<body>
    <header>
        <div class="container-hero">
            <span class="badge-temporada">⚡TEMPORADA 04 ATIVA</span>
            <h1 class="titulo-hero">CyberStrike: Arena do Futuro</h1>
            <p class="texto-hero">Monte seu esquadrão cibernético, dispute torneios semanais e domine os servidores de
                alta performace com taxas de 144 FPS e premiações exclusivas.</p>
            <div class="container-badges-inferiores">
                <span class="badge-inferior">🛡️Anti-Cheat</span>
                <span class="badge-inferior">⚡128 Tick</span>
                <span class="badge-inferior">🏆Ranqueado</span>
            </div>
            <button class="btn-jogar-agora">JOGAR AGORA ⚔️</button>
        </div>
        <img src="assets/cyberstrike-art.png" alt="Logo da CyberStrike Arena" class="logo-cyberstrike">
    </header>
</body>

</html>
